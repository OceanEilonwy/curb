[package]
name = "curb-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
slint-build = "1.19.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
chrono.workspace = true
curb-core = { path = "../../crates/curb-core" }
curb-preset-steam = { path = "../../crates/presets/steam" }
serde.workspace = true
serde_json.workspace = true
slint = { version = "1.19.0", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "software-renderer-path",
    "accessibility",
    "compat-1-2",
    "system-tray",
    "unstable-winit-030",
] }
tokio.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
curb-windows = { path = "../../crates/adaptors/windows" }

[target.'cfg(target_os = "linux")'.dependencies]
curb-linux = { path = "../../crates/adaptors/linux" }
curb-xdg = { path = "../../crates/adaptors/xdg" }
