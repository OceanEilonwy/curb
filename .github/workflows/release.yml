name: Build & Release (Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Core & Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Run Rust workspace tests
        run: cargo test --workspace

      - name: Type-check & build SolidJS 2 frontend
        working-directory: apps/curb-app
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm typecheck
          pnpm build

  release-windows:
    name: Build Windows Release
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Build curb-service & curb-cli (release)
        run: cargo build --release --workspace

      - name: Build Curb Tauri v2 App & MSI Installer
        working-directory: apps/curb-app
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm tauri build --bundles msi

      - name: Package Windows Release Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release/curb-windows-x64 | Out-Null
          Copy-Item target/release/curb-service.exe dist-release/curb-windows-x64/
          Copy-Item target/release/curb-cli.exe dist-release/curb-windows-x64/
          Copy-Item apps/curb-app/src-tauri/target/release/curb-app.exe dist-release/curb-windows-x64/
          Copy-Item README.md dist-release/curb-windows-x64/
          Copy-Item LICENSE dist-release/curb-windows-x64/

          $msi = Get-ChildItem apps/curb-app/src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          if ($msi) {
            Copy-Item $msi.FullName dist-release/curb-windows-x64.msi
          }

          Compress-Archive -Path dist-release/curb-windows-x64/* -DestinationPath dist-release/curb-windows-x64.zip -Force
          Get-ChildItem dist-release

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-release/curb-windows-x64.msi
            dist-release/curb-windows-x64.zip
            target/release/curb-service.exe
            target/release/curb-cli.exe
