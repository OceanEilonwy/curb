name: Build & Release (Windows & Linux)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Workspace & Slint UI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: curb-linux
          cache-on-failure: true

      - name: Install Linux fontconfig dev headers (for Slint)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev pkg-config

      - name: Run Rust workspace tests
        run: cargo test --workspace

  release-linux:
    name: Build Linux Release (.deb, .rpm, .tar.gz)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: curb-linux
          cache-on-failure: true

      - name: Install Linux build & packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev pkg-config rpm

      - name: Build curb-service, curb-cli & Slint curb-app (release)
        run: cargo build --release --workspace

      - name: Package .deb, .rpm, and universal .tar.gz
        run: |
          VERSION="$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')"
          ./packaging/linux/build-deb.sh "$VERSION" amd64 dist-release
          ./packaging/linux/build-rpm.sh "$VERSION" x86_64 dist-release

          TAR_DIR="dist-release/curb-${VERSION}-linux-x86_64"
          mkdir -p "$TAR_DIR/runit"
          cp target/release/curb-app target/release/curb-cli target/release/curb-service "$TAR_DIR/"
          cp packaging/linux/curb.service packaging/linux/curb.desktop packaging/linux/org.curb.policy "$TAR_DIR/"
          cp packaging/linux/runit/run packaging/linux/runit/log-run "$TAR_DIR/runit/"
          cp packaging/linux/install.sh "$TAR_DIR/"
          cp apps/curb-app/icons/128x128.png "$TAR_DIR/icon-128.png"
          cp apps/curb-app/icons/32x32.png "$TAR_DIR/icon-32.png"
          cp README.md LICENSE "$TAR_DIR/"
          tar -C dist-release -czf "dist-release/curb-${VERSION}-linux-x86_64.tar.gz" "curb-${VERSION}-linux-x86_64"
          ls -lh dist-release/

      - name: Publish Linux Artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-release/*.deb
            dist-release/*.rpm
            dist-release/*.tar.gz

  release-windows:
    name: Build Windows Release
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: curb-windows
          cache-on-failure: true

      - name: Run Rust workspace tests (Windows)
        run: cargo test --workspace

      - name: Build curb-service, curb-cli & Slint curb-app (release)
        run: cargo build --release --workspace

      - name: Build Curb Per-User NSIS Installer (zero UAC to install)
        shell: pwsh
        run: |
          $makensis = Get-Command makensis -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $makensis -and (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          if (-not $makensis) {
            choco install -y nsis
            $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          & $makensis apps/curb-app/windows/installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }

      - name: Package Windows Release Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release/curb-windows-x64 | Out-Null
          Copy-Item target/release/curb-service.exe dist-release/curb-windows-x64/
          Copy-Item target/release/curb-cli.exe dist-release/curb-windows-x64/
          Copy-Item target/release/curb-app.exe dist-release/curb-windows-x64/
          Copy-Item README.md dist-release/curb-windows-x64/
          Copy-Item LICENSE dist-release/curb-windows-x64/
          Copy-Item target/release/curb-windows-x64-setup.exe dist-release/curb-windows-x64-setup.exe

          Compress-Archive -Path dist-release/curb-windows-x64/* -DestinationPath dist-release/curb-windows-x64-portable.zip -Force
          Get-ChildItem dist-release

      - name: Run Windows E2E gate before publishing release
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/e2e-windows.ps1 `
            -CliPath target\release\curb-cli.exe `
            -ServicePath target\release\curb-service.exe `
            -SetupExePath dist-release\curb-windows-x64-setup.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-release/curb-windows-x64-setup.exe
            dist-release/curb-windows-x64-portable.zip
