name: Build & Release (Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Core & Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Run Rust workspace tests
        run: cargo test --workspace

      - name: Type-check & build SolidJS 2 frontend
        working-directory: apps/curb-app
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm typecheck
          pnpm build

  release-windows:
    name: Build Windows Release
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Run Rust workspace tests (Windows)
        run: cargo test --workspace

      - name: Build curb-service & curb-cli (release)
        run: cargo build --release --workspace

      - name: Stage service & CLI binaries into Tauri bundle resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path apps/curb-app/src-tauri/resources | Out-Null
          Copy-Item target/release/curb-service.exe apps/curb-app/src-tauri/resources/
          Copy-Item target/release/curb-cli.exe apps/curb-app/src-tauri/resources/

      - name: Build Curb Tauri v2 Per-User NSIS Installer (zero UAC to install)
        working-directory: apps/curb-app
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm tauri build --bundles nsis

      - name: Package Windows Release Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release/curb-windows-x64 | Out-Null
          Copy-Item target/release/curb-service.exe dist-release/curb-windows-x64/
          Copy-Item target/release/curb-cli.exe dist-release/curb-windows-x64/
          Copy-Item apps/curb-app/src-tauri/target/release/curb-app.exe dist-release/curb-windows-x64/
          Copy-Item README.md dist-release/curb-windows-x64/
          Copy-Item LICENSE dist-release/curb-windows-x64/

          $setup = Get-ChildItem apps/curb-app/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if ($setup) {
            Copy-Item $setup.FullName dist-release/curb-windows-x64-setup.exe
          }

          Compress-Archive -Path dist-release/curb-windows-x64/* -DestinationPath dist-release/curb-windows-x64-portable.zip -Force
          Get-ChildItem dist-release

      - name: Run Windows E2E gate before publishing release
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/e2e-windows.ps1 `
            -CliPath target\release\curb-cli.exe `
            -ServicePath target\release\curb-service.exe `
            -SetupExePath dist-release\curb-windows-x64-setup.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-release/curb-windows-x64-setup.exe
            dist-release/curb-windows-x64-portable.zip
