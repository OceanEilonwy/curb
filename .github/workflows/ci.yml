name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  linux-tests:
    name: Workspace & Slint UI Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: curb-linux
          cache-on-failure: true

      - name: Install Linux build & packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1-dev pkg-config rpm libarchive-tools zstd
          curl -fsSL https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz \
            | sudo tar -xJ -C /usr/local/bin --strip-components=3 ./usr/bin/xbps-create.static
          sudo ln -sf /usr/local/bin/xbps-create.static /usr/local/bin/xbps-create
          xbps-create -V

      - name: Run Rust workspace tests (core, service, cli, Slint UI)
        run: cargo test --workspace

      - name: Build Linux release binaries & verify .deb, .rpm, .pkg.tar.zst, and .xbps packaging
        run: |
          cargo build --release --workspace
          ./packaging/linux/build-deb.sh
          ./packaging/linux/build-rpm.sh
          ./packaging/linux/build-arch.sh
          ./packaging/linux/build-xbps.sh
          ./packaging/linux/build-relay-deb.sh
          ./packaging/linux/build-relay-rpm.sh
          ls -lh dist-release/

  windows-e2e:
    name: Windows Service, Slint UI & Installer E2E
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: curb-windows
          cache-on-failure: true

      - name: Run Rust workspace tests (Windows)
        run: cargo test --workspace

      - name: Build curb-service, curb-cli & Slint curb-app (release)
        run: cargo build --release --workspace

      - name: Build Curb Per-User NSIS Installer
        shell: pwsh
        run: |
          $makensis = Get-Command makensis -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $makensis -and (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          if (-not $makensis) {
            choco install -y nsis
            $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          }
          & $makensis apps/curb-app/windows/installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }

      - name: Run Windows E2E test suite (SCM service, non-admin IPC, ACLs, NSIS installer)
        shell: pwsh
        run: |
          $setup = "target\release\curb-windows-x64-setup.exe"
          if (-not (Test-Path $setup)) { throw "NSIS setup executable not found at $setup" }
          pwsh -NoProfile -File scripts/e2e-windows.ps1 `
            -CliPath target\release\curb-cli.exe `
            -ServicePath target\release\curb-service.exe `
            -SetupExePath $setup
